name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version from manifest.json, without the v prefix
        required: true
        type: string
      channel:
        description: Publish a prerelease or promote/create a stable release
        required: true
        default: prerelease
        type: choice
        options:
          - prerelease
          - stable

permissions: {}

concurrency:
  group: textbelt-sms-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.contract.outputs.tag }}
      operation: ${{ steps.state.outputs.operation }}
      release_sha: ${{ steps.state.outputs.release_sha }}
    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Releases must be dispatched from main." >&2
          exit 1

      - name: Checkout the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Validate version contract
        id: contract
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          tag="$(python scripts/release_contract.py --version "$VERSION")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Determine allowed release operation
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.contract.outputs.tag }}
          CHANNEL: ${{ inputs.channel }}
        shell: bash
        run: |
          if ! git show-ref --verify --quiet "refs/tags/$TAG"; then
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG exists without a fetched tag; refusing to continue." >&2
              exit 1
            fi
            echo "operation=create" >> "$GITHUB_OUTPUT"
            echo "release_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists without a GitHub release; refusing to move or reuse it." >&2
            exit 1
          fi

          if [[ "$CHANNEL" != "stable" ]]; then
            echo "Tag and release $TAG already exist; only stable promotion is permitted." >&2
            exit 1
          fi

          if [[ "$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)" != "true" ]]; then
            echo "Release $TAG is already stable; refusing duplicate publication." >&2
            exit 1
          fi

          release_sha="$(git rev-list -n 1 "$TAG")"
          if ! git merge-base --is-ancestor "$release_sha" "$GITHUB_SHA"; then
            echo "Tag $TAG is not in the history of this main commit; refusing promotion." >&2
            exit 1
          fi

          echo "operation=promote" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

      - name: Check out the immutable prerelease for promotion
        if: steps.state.outputs.operation == 'promote'
        env:
          TAG: ${{ steps.contract.outputs.tag }}
        run: git checkout --detach "$TAG"

      - name: Install requirements from the verified tree
        run: python -m pip install -r requirements.txt -r requirements_test.txt

      - name: Revalidate the checked-out release contract
        if: steps.state.outputs.operation == 'promote'
        env:
          VERSION: ${{ inputs.version }}
        run: python scripts/release_contract.py --version "$VERSION"

      - name: Run unit tests
        run: python -m pytest

      - name: Run Ruff
        run: |
          python -m ruff check .
          python -m ruff format . --check

      - name: Run Home Assistant smoke harness
        run: bash tests/smoke/run.sh

      - name: Run Hassfest validation
        uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb # master

      - name: Run HACS validation
        env:
          # The HACS action validates GitHub content, not the local checkout.
          REPOSITORY_REF: ${{ steps.state.outputs.release_sha }}
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
          ignore: brands

  publish:
    name: Publish release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the verified release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.verify.outputs.release_sha }}

      - name: Create GitHub release
        if: needs.verify.outputs.operation == 'create'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          CHANNEL: ${{ inputs.channel }}
          RELEASE_SHA: ${{ needs.verify.outputs.release_sha }}
        shell: bash
        run: |
          if git show-ref --verify --quiet "refs/tags/$TAG" || gh release view "$TAG" >/dev/null 2>&1; then
            echo "Tag or release $TAG appeared after verification; refusing to reuse it." >&2
            exit 1
          fi

          git tag "$TAG" "$RELEASE_SHA"
          git push origin "refs/tags/$TAG"

          remote_sha="$(git ls-remote origin "refs/tags/$TAG" | awk '{print $1}')"
          if [[ "$remote_sha" != "$RELEASE_SHA" ]]; then
            echo "Remote tag $TAG targets $remote_sha, expected $RELEASE_SHA." >&2
            exit 1
          fi

          args=("$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes)
          if [[ "$CHANNEL" == "prerelease" ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"

      - name: Promote GitHub prerelease
        if: needs.verify.outputs.operation == 'promote'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_SHA: ${{ needs.verify.outputs.release_sha }}
        shell: bash
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          current_sha="$(git rev-list -n 1 "$TAG")"
          if [[ "$current_sha" != "$RELEASE_SHA" ]]; then
            echo "Tag $TAG moved after verification; refusing promotion." >&2
            exit 1
          fi

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG disappeared after verification; refusing promotion." >&2
            exit 1
          fi
          if [[ "$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)" != "true" ]]; then
            echo "Release $TAG is no longer a prerelease; refusing duplicate promotion." >&2
            exit 1
          fi

          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest --title "$TAG"
