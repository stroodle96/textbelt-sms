name: Protected live configuration smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  live:
    if: ${{ github.ref == 'refs/heads/main' }}
    environment: textbelt-live-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run protected Textbelt _test smoke through HA
        env:
          TEXTBELT_API_KEY: ${{ secrets.TEXTBELT_API_KEY_test }}
          TEXTBELT_SMS_API_BASE_URL: https://textbelt.com
          LIVE_SMOKE: "1"
        run: |
          if [[ -z "$TEXTBELT_API_KEY" ]]; then
            echo "TEXTBELT_API_KEY_test must be configured in the protected environment." >&2
            exit 2
          fi
          case "$TEXTBELT_API_KEY" in
            *_test) ;;
            *) echo "The protected Textbelt key must use the _test suffix." >&2; exit 2 ;;
          esac
          bash tests/smoke/run.sh
      - name: Upload live smoke artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: textbelt-live-smoke
          path: /tmp/textbelt-ha-artifacts-*/
          if-no-files-found: warn
